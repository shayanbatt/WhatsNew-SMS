<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsNew SMS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #e9edef;
    }

    .app {
      max-width: 500px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #0879c9;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 23px;
    }

    .new-chat {
      font-size: 25px;
      cursor: pointer;
    }

    .search {
      padding: 10px;
      background: #f0f2f5;
    }

    .search input {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 20px;
      outline: none;
    }

    .chat {
      display: flex;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .chat:hover {
      background: #f5f5f5;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #0879c9;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      margin-right: 15px;
    }

    .chat-info h3 {
      font-size: 17px;
      margin-bottom: 5px;
    }

    .chat-info p {
      color: #777;
      font-size: 14px;
    }

    .bottom {
      margin-top: auto;
      display: flex;
      justify-content: space-around;
      padding: 14px;
      border-top: 1px solid #ddd;
      background: white;
    }

    .bottom button {
      border: none;
      background: none;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>WhatsNew SMS</h1>
      <div class="new-chat">✏️</div>
    </div>

    <div class="search">
      <input type="text" placeholder="Search chats">
    </div>

    <div class="chat">
      <div class="avatar">A</div>
      <div class="chat-info">
        <h3>Ali</h3>
        <p>Hello! How are you?</p>
      </div>
    </div>

    <div class="chat">
      <div class="avatar">S</div>
      <div class="chat-info">
        <h3>Shahid</h3>
        <p>See you tomorrow 👍</p>
      </div>
    </div>

    <div class="chat">
      <div class="avatar">F</div>
      <div class="chat-info">
        <h3>Family</h3>
        <p>Good morning everyone ❤️</p>
      </div>
    </div>

    <div class="bottom">
      <button>💬 Chats</button>
      <button>👥 Contacts</button>
      <button>⚙️ Settings</button>
    </div>

  </div>

</body>
</html>
